    provider: google
    property: G-JVWLTHSQWM

extra_css:
  - https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css
