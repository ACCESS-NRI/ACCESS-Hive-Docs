# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# ReadtheDocs config version
version: 2

# Set the ReadtheDocs Docker image OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # `MODIFY IF NEEDED` - comment the lines that are not needed
    post_checkout: 
    # Test
    - git clone https://github.com/ACCESS-NRI/ACCESS-Hive-Docs
    # Cancel PR preview if the PR base is not the default branch
    - bash .readthedocs/scripts/cancel_pr_preview_if_base_not_default.sh


# Build documentation with Mkdocs
mkdocs:
  configuration: mkdocs.yml

# Python requirements to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
    - requirements: requirements.txt