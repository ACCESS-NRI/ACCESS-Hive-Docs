site_name: ACCESS-NRI
site_description: Australia's climate simulator, ACCESS-NRI, is a national research infrastructure that supports the ACCESS climate models.
site_url: https://www.access-nri.org.au/
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  logo: wp-content/themes/accessnri/images/logos/access_logo_rgb.svg
  favicon: wp-content/themes/accessnri/images/win8-tile-icon.png
  font:
    text: Ubuntu
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
  icon:
    edit: material/pencil

repo_url: https://github.com/ACCESS-NRI/access-nri-website
edit_uri: edit/main/docs/

extra_css:
  - https://fonts.googleapis.com/css?family=Source+Sans+Pro:700
  - vendor/swiper-bundle.min.css
  - stylesheets/accessnri.css

extra_javascript:
  - vendor/swiper-bundle.min.js
  - javascripts/masthead.js
  - javascripts/cards.js

plugins:
  - search
  - macros
  - redirects:
      redirect_maps:
        author/coreyhanrahan.md: news/index.md
        author/itomic.md: news/index.md
        author/nataliabateman.md: news/index.md
        people-category/access-nri-board.md: about/access-nri-board.md
        people-category/access-nri-liaison.md: teams/all-access-nri-teams.md
        people-category/atmosphere-model-team.md: teams/atmosphere-model-team.md
        people-category/atmospheric-modelling-wg-co-chairs.md: teams/all-access-nri-teams.md
        people-category/business-team.md: teams/business-team.md
        people-category/cosima-ocean-and-sea-ice-wg-co-chairs.md: teams/all-access-nri-teams.md
        people-category/cryosphere-wg-co-chairs.md: teams/all-access-nri-teams.md
        people-category/data-team.md: teams/all-access-nri-teams.md
        people-category/earth-system-modelling-wg-co-chairs.md: teams/all-access-nri-teams.md
        people-category/executive-team.md: teams/executive-team.md
        people-category/forecasting-and-prediction-wg-co-chairs.md: teams/all-access-nri-teams.md
        people-category/ice-sheet-modelling-team.md: teams/ice-sheet-modelling-team.md
        people-category/land-surface-model-team.md: teams/land-surface-model-team.md
        people-category/land-surface-modelling-wg-co-chairs.md: teams/all-access-nri-teams.md
        people-category/model-evaluation-and-diagnostics-team.md: teams/all-access-nri-teams.md
        people-category/model-release-team.md: teams/model-release-team.md
        people-category/ocean-model-team.md: teams/ocean-model-team.md
        people-category/regional-and-coastal-ocean-modelling-team.md: teams/all-access-nri-teams.md
        people-category/research-software-engineers.md: teams/all-access-nri-teams.md
        people-category/scientific-advisory-committee-sac.md: about/scientific-advisory-committee-sac.md
        people-category/software-transformation-team.md: teams/software-transformation-team.md
        people-category/team-leaders.md: teams/all-access-nri-teams.md
        people-category/user-training-team.md: teams/user-training-team.md
        news-and-events/latest-news.md: news/index.md
        category/in-conversation-with.md: news/in-conversation-with.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: false

extra:
  contact_email: access.nri@anu.edu.au
  mailchimp_action: "https://access-nri.us14.list-manage.com/subscribe/post?u=2e82a242a5023d286ad0d4555&id=aed3bbbb13"
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/access-nri
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/access-nri.bsky.social
    - icon: fontawesome/brands/github
      link: https://github.com/access-nri

