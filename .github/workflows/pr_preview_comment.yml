name: Pr-preview comment
on:
  pull_request_target:
    types: opened

permissions:
  pull-requests: write

jobs:
  documentation-links:
    runs-on: ubuntu-latest
    steps:
      - uses: readthedocs/actions/preview@b8bba1484329bda1a3abe986df7ebc80a8950333 # v1.5
        with:
          project-slug: "access-hive-docs"
          single-language: true
          single-version: true
          message-template: |
            ---
            :books: PR Preview :link: --> {docs-pr-index-url}
