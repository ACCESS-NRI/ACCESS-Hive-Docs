# =========== IMPORTANT!! READ THIS!! ============ #
# This file is used to check links and can be copied to be used in other websites.

# When you copy this file, make sure to check and modify the fields
# that here are marked with `MODIFY`.
# ============================================== #

name: Check links

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  check-links:
    uses: access-nri/access-hive-docs/.github/workflows/check_links_workflow.yml@davide/test_rtd
    with:
      repo: '${{ github.repository }}'
      ref_name: "${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref_name }}"
      rtd_project: access-hive-docs  # MODIFY: change this to the Read the Docs project
      mkdocs_yaml: 'mkdocs.yml' # MODIFY: path to mkdocs.yml
      python_requirements_txt: 'requirements.txt' # MODIFY: path to requirements.txt
      lychee_config: '' # MODIFY: path to lychee config (if not included, the Hive Docs' one gets used)
    #   # MODIFY: Uncomment the lines below if the repo is private. 
    #   # You also need to create a secret named REPO_READ_TOKEN with a token that has repo read permissions.
    # secrets:
    #   repo_read_token: ${{ secrets.REPO_READ_TOKEN }} "Token with read permissions. Needed for private repositories."